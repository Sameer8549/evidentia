name: Backend tests

on:
  push:
    branches:
      - main
      - backend/ps01-multimodal
  pull_request:
    branches:
      - main
      - backend/ps01-multimodal

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-eng

      - name: Install Poetry
        run: python -m pip install "poetry==1.8.3"

      - name: Install backend dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run backend unit and API tests
        run: poetry run pytest -v
